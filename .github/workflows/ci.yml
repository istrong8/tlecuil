name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install
        run: pip install -r requirements.txt
      - name: Verification and benchmark tests
        run: python -m pytest -q
      - name: Benchmark tables are up to date
        run: |
          python benchmarks.py
          git diff --exit-code docs/benchmark_tables.tex
      - name: JavaScript / Python parity
        run: |
          python tlecuil.py --export-json /tmp/parity.json
          node check_parity.js web/tlecuil.html /tmp/parity.json

  docs:
    runs-on: ubuntu-latest
    needs: tests
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Regenerate figures
        run: |
          pip install -r requirements.txt
          cd docs && python make_figures.py
      - name: Build PDFs
        uses: xu-cheng/latex-action@v3
        with:
          working_directory: docs
          root_file: |
            tlecuil_theory.tex
            tlecuil_vv_plan.tex
      - name: Code references match the PDF
        run: python docs/sync_refs.py --check
      - uses: actions/upload-artifact@v4
        with:
          name: tlecuil-pdfs
          path: docs/*.pdf
